[project]
name = "teamora-requisition-service"
version = "0.1.0"
description = "Teamora Requisition service (Module 1): requisitions, JD versions, scoring matrix, freeze (TDD §6, §8). Owns the `requisition` schema."
requires-python = ">=3.11"
dependencies = ["teamora-common"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
requisition_service = ["migrations/*.sql"]
