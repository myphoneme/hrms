name: Docs Review Pipeline

# Publishes docs-site/ (MkDocs) as a reviewable web page:
#   - on a pull request: builds a PR preview and deploys it to
#     gh-pages/pr-<number>/, then comments the preview link on the PR
#     so the Team Lead / PO can read it before approving.
#   - on push/merge to main: deploys the same build to gh-pages/ (root),
#     which is the "signed off" published copy. The merge itself is the
#     sign-off audit record (see docs-site/docs/index.md).

on:
  pull_request:
    paths:
      - "docs-site/**"
  push:
    branches: [main]
    paths:
      - "docs-site/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build site
        working-directory: docs-site
        run: mkdocs build --strict --site-dir ../_site

      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Comment preview link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = context.payload.pull_request.number;
            const url = `https://myphoneme.github.io/hrms/pr-${prNum}/`;
            const body = `📄 **Review preview published:** ${url}\n\nRead it there, then leave your review feedback as inline comments on this PR's **Files changed** tab — that's the permanent review record. Approve + merge when ready to sign off.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNum,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('Review preview published'));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNum, body });
            }

      - name: Deploy published site (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true
