# Phoneme SOP Section 8.5 — Production CI/CD Pipeline
#
# Node variant: the React/TypeScript frontend only. Every backend service is
# Python/FastAPI (Teamora_Technical_Stack_Charter_v1.2.md) — use
# production-release-python.yml for those.
#
# NOTE (2026-09-25): production now deploys from an approved release tag `vX.Y.Z` on
# the `staging` branch, not from `main` (decided 2026-09-23). Change the trigger below
# to `on: push: tags: ['v*']` when this template is adopted (COOLIFY_SETUP.md).
#
# Fires only on a merge into `main`. That merge is itself gated by the
# `production` GitHub Environment's required reviewer(s) below — this is the
# Release Owner's go/no-go from SOP Section 5.4/5.5, enforced by GitHub rather
# than by convention alone. On approval: full regression suite, then Coolify
# redeploys Production from the exact approved commit, then an automated
# smoke test. A failed smoke test triggers an automatic rollback.
#
# One Coolify application per service per environment — copy this file per
# service (scoping `on.push.paths` once the repo layout is settled) with its
# own COOLIFY_PRODUCTION_WEBHOOK_<SERVICE> / PRODUCTION_SMOKE_URL_<SERVICE>.
#
# SETUP REQUIRED before this workflow can run (see Deployment/ci-cd/COOLIFY_SETUP.md):
#   1. A Coolify "Production" application, pointed at this repo's `main` branch,
#      auto-deploy left OFF (this workflow calls its webhook explicitly instead,
#      only after the regression suite and approval both pass).
#   2. GitHub repo Settings -> Environments -> create "production", add the
#      Release Owner as a required reviewer.
#   3. GitHub repo secret COOLIFY_PRODUCTION_WEBHOOK with that application's
#      deploy webhook URL, and PRODUCTION_SMOKE_URL with the health-check
#      endpoint (SOP Section 8.3) to verify after deploy.

name: Production Release

on:
  push:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Full automated regression suite
        run: npm run test:regression

  deploy-to-production:
    needs: regression
    runs-on: ubuntu-latest
    environment: production   # <- requires the Release Owner's approval to proceed
    steps:
      - name: Trigger Coolify production redeploy
        run: |
          curl --fail --silent --show-error \
            -X POST "${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}"

      - name: Wait for rollout
        run: sleep 30

      - name: Post-deploy smoke test
        id: smoke
        run: |
          curl --fail --silent --show-error "${{ secrets.PRODUCTION_SMOKE_URL }}"

      - name: Rollback on failed smoke test
        if: failure()
        run: |
          echo "Smoke test failed — triggering rollback to last known-good build."
          curl --fail --silent --show-error \
            -X POST "${{ secrets.COOLIFY_PRODUCTION_ROLLBACK_WEBHOOK }}"
          echo "Per SOP Section 5.6: file the written incident note before any further action."
