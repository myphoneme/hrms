# Phoneme SOP Section 8.3 — Staging Server Auto-Deploy on Commit
#
# Python/FastAPI variant: every Teamora backend service (Auth/AAA, Notification,
# Requisition, JD Generation, Publish, Candidate, Resume Parsing, Dedupe per
# Teamora_Technical_Stack_Charter_v1.2.md). For the React frontend, use
# staging-deploy.yml instead. Verified commands: .github/workflows/backend-ci.yml on `staging`.
#
# Fires on every push/merge into `staging`. Runs the build + automated test
# suite (SOP Section 5.2); only on a fully green run does it call Coolify's
# deploy webhook to redeploy the Staging application from this exact commit.
#
# One Coolify application per service per environment — copy this file per
# service (scoping `on.push.paths` once the repo layout is settled) with its
# own COOLIFY_STAGING_WEBHOOK_<SERVICE> secret.
#
# SETUP REQUIRED before this workflow can run (see Deployment/ci-cd/COOLIFY_SETUP.md):
#   1. Coolify installed on Phoneme's own server/VM, with a "Staging" application
#      created for this service, pointed at this repo's `staging` branch.
#   2. In Coolify: Staging application -> Webhooks -> copy the deploy webhook URL.
#   3. In GitHub: Settings -> Secrets and variables -> Actions, add a repo secret
#      named COOLIFY_STAGING_WEBHOOK (or COOLIFY_STAGING_WEBHOOK_<SERVICE>) with
#      that URL.

name: Staging Deploy (Python)

on:
  push:
    branches: [staging]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run automated test suite
        run: pytest --maxfail=1 --disable-warnings

  deploy-to-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify staging redeploy
        run: |
          curl --fail --silent --show-error \
            -X POST "${{ secrets.COOLIFY_STAGING_WEBHOOK }}"

      - name: Note
        run: echo "Coolify pulls this exact commit and redeploys the Staging application. QA (Machine B, SOP Section 8.2) tests this build next."
