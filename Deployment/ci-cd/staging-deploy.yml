# Phoneme SOP Section 8.3 — Staging Server Auto-Deploy on Commit
#
# Node variant: the React/TypeScript frontend only. Every backend service is
# Python/FastAPI (Teamora_Technical_Stack_Charter_v1.2.md) — use
# staging-deploy-python.yml for those.
#
# Fires on every push/merge into `staging`. Runs the build + automated test
# suite (SOP Section 5.2); only on a fully green run does it call Coolify's
# deploy webhook to redeploy the Staging application from this exact commit.
#
# One Coolify application per service per environment (Technical Stack Charter,
# field 6/8) — copy this file per service and scope its `on.push.paths` to that
# service's folder once the repo layout (monorepo services/<name>/ vs. polyrepo)
# is settled, and give it its own COOLIFY_STAGING_WEBHOOK_<SERVICE> secret.
#
# SETUP REQUIRED before this workflow can run (see Deployment/ci-cd/COOLIFY_SETUP.md):
#   1. Coolify installed on Phoneme's own server/VM, with a "Staging" application
#      created for this service, pointed at this repo's `staging` branch.
#   2. In Coolify: Staging application -> Webhooks -> copy the deploy webhook URL.
#   3. In GitHub: Settings -> Secrets and variables -> Actions, add a repo secret
#      named COOLIFY_STAGING_WEBHOOK with that URL (or COOLIFY_STAGING_WEBHOOK_<SERVICE>
#      once more than one service's workflow lives in this repo).

name: Staging Deploy

on:
  push:
    branches: [staging]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run automated test suite
        run: npm test -- --ci

  deploy-to-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify staging redeploy
        run: |
          curl --fail --silent --show-error \
            -X POST "${{ secrets.COOLIFY_STAGING_WEBHOOK }}"

      - name: Note
        run: echo "Coolify pulls this exact commit and redeploys the Staging application. QA (Machine B, SOP Section 8.2) tests this build next."
